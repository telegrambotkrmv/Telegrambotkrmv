providers = ["node"]

[phases.setup]
nixPkgs = ["nodejs_20", "ffmpeg", "python3", "curl", "cacert"]

[phases.install]
cmds = [
  "corepack enable",
  "corepack prepare pnpm@9.15.0 --activate",
  "pnpm install --no-frozen-lockfile"
]

[phases.build]
cmds = [
  "mkdir -p /app/bin",
  "curl -sSL -o /app/bin/yt-dlp https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp",
  "chmod +x /app/bin/yt-dlp",
  "pnpm --filter @workspace/api-server run build"
]

[start]
cmd = "pnpm --filter @workspace/api-server run start"

[variables]
YTDLP_PATH = "/app/bin/yt-dlp"
NODE_ENV = "production"
